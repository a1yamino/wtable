name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(git ls-files '*.go' | xargs gofmt -l)"
      - name: Vet
        run: go vet ./cmd/... ./internal/...
      - name: Test
        run: go test -race ./cmd/... ./internal/...

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install
        working-directory: desktop/frontend
        run: npm ci
      - name: Build
        working-directory: desktop/frontend
        run: npm run build

  desktop:
    runs-on: macos-14
    env:
      CGO_ENABLED: "1"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CGO_CFLAGS: "-mmacosx-version-min=13.0"
      CGO_CXXFLAGS: "-mmacosx-version-min=13.0"
      CGO_LDFLAGS: "-mmacosx-version-min=13.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install Wails
        run: |
          WAILS_VERSION="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@$WAILS_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build macOS application
        working-directory: desktop
        run: wails build -clean -v 1
      - name: Check desktop Go code
        run: |
          go vet ./...
          go vet -tags 'desktop,production' ./desktop
          go test -tags 'desktop,production' ./desktop
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: wtable-desktop-macos
          path: desktop/build/bin/wtable.app
          if-no-files-found: error

  notify:
    if: always()
    needs: [backend, frontend, desktop]
    runs-on: ubuntu-24.04
    steps:
      - name: Notify Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          if not token or not chat_id:
              print("::warning title=Telegram notification skipped::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured")
              sys.exit(0)

          results = {
              "backend": os.environ.get("BACKEND_RESULT", "unknown"),
              "frontend": os.environ.get("FRONTEND_RESULT", "unknown"),
              "desktop": os.environ.get("DESKTOP_RESULT", "unknown"),
          }
          if any(result == "cancelled" for result in results.values()):
              status = "cancelled"
          elif all(result == "success" for result in results.values()):
              status = "success"
          else:
              status = "failure"

          presentations = {
              "success": ("✅", "CI passed", "All backend, frontend, and macOS desktop checks passed."),
              "failure": ("❌", "CI failed", "One or more checks failed. Open the workflow run for details."),
              "cancelled": ("⚪", "CI cancelled", "The workflow was cancelled before completion."),
          }
          icon, title, summary = presentations.get(
              status, ("ℹ️", "CI status updated", f"Current status: {status}")
          )
          result_icons = {
              "success": "✅",
              "failure": "❌",
              "cancelled": "⚪",
              "skipped": "⏭️",
          }

          def value(name):
              return html.escape(os.environ.get(name, ""), quote=True)

          def job_line(name, result):
              icon = result_icons.get(result, "ℹ️")
              return f"{icon} <b>{name}</b>  <code>{html.escape(result)}</code>"

          commit = value("COMMIT_SHA")[:7]
          message = "\n".join(
              [
                  f"<b>{icon} wtable · {html.escape(title)}</b>",
                  f"<blockquote>{html.escape(summary)}</blockquote>",
                  "",
                  "<b>Checks</b>",
                  job_line("Backend", results["backend"]),
                  job_line("Frontend", results["frontend"]),
                  job_line("Desktop", results["desktop"]),
                  "",
                  f"<b>Repository</b>  <code>{value('REPOSITORY')}</code>",
                  f"<b>Branch</b>  <code>{value('BRANCH')}</code>",
                  f"<b>Commit</b>  <code>{commit}</code>",
                  f"<b>Trigger</b>  {value('EVENT_NAME')} by {value('ACTOR')}",
                  "",
                  f'<a href="{value("RUN_URL")}">Open workflow run →</a>',
              ]
          )
          payload = json.dumps(
              {
                  "chat_id": chat_id,
                  "text": message,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": True,
              }
          ).encode()
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  response.read()
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", errors="replace")
              print(f"::warning title=Telegram notification failed::HTTP {exc.code}: {detail}")
          except urllib.error.URLError as exc:
              print(f"::warning title=Telegram notification failed::{exc.reason}")
          PY
